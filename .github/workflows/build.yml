name: build-linux-nightly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake make ccache pkg-config \
            libpng-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libglfw3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-${{ github.ref }}-
            ccache-${{ runner.os }}-clang-

      - name: Configure (Release, clang, Makefiles, optimized, quiet)
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-O3 -DNDEBUG -w" \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -w -flto=thin" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto=thin" \
            -DCMAKE_SHARED_LINKER_FLAGS="-flto=thin"

      - name: Build (parallel)
        run: |
          cmake --build build -- -j"$(nproc)"

      - name: Package build outputs
        run: |
          set -euxo pipefail
          mkdir -p dist

          # Grab likely outputs (executables + shared libs + static libs)
          find build -type f \( -perm -111 -o -name "*.so" -o -name "*.a" \) -print0 \
            | tar --null -T - -czf dist/4jcraft-linux-x86_64.tar.gz

          echo "Packaged:"
          ls -lah dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4jcraft-linux
          path: dist/4jcraft-linux-x86_64.tar.gz

      - name: Create/Update nightly release (tag: nightly)
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/4jcraft-linux-x86_64.tar.gz
          token: ${{ github.token }}

      - name: Print nightly.link URL (for the artifact)
        run: |
          echo "Nightly.link (artifact) URL format:"
          echo "https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/4jcraft-linux.zip"
